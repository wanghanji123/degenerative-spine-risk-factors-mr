   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ac4c60" x="308.52" y="39.951881" transform="rotate(-0 308.52 39.951881)">Primary registry outcomes</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(308.52 62.476837)">FinnGen R5 IVDD: 20,001 cases</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(308.52 75.574259)">Spinal stenosis: 9,169 cases</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(308.52 88.671681)">164,682 controls for each endpoint</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #444444" x="23.94" y="156.375881" transform="rotate(-0 23.94 156.375881)">Primary univariable analyses</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(23.94 178.900837)">480 BMI / 85 smoking SNPs per outcome</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(23.94 191.998259)">IVW; four tests, alpha = 0.0125</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(23.94 205.095681)">Weighted median; MR-Egger; diagnostics</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #444444" x="308.52" y="156.375881" transform="rotate(-0 308.52 156.375881)">Exploratory multivariable analyses</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(308.52 178.900837)">594 union SNPs; 1 coordinate exclusion</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(308.52 191.998259)">501 joint-LD-selected candidates</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(308.52 205.095681)">429 exact, nonpalindromic SNPs per outcome</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #444444" x="23.94" y="286.659881" transform="rotate(-0 23.94 286.659881)">Interpretation boundaries</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(23.94 309.184837)">Secondary: symptom endpoints, alternative adiposity, reverse MR, CAD comparison</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(23.94 322.282259)">No independent outcome replication; no measured zero-overlap claim</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(23.94 335.379681)">MRlap corrections and unverified UKB pain ORs excluded from current inference</text>
   </g>
